[project]
name = "duallgd"
version = "0.1.0"
description = "Unlocking High-Fidelity Molecular Generation from Mass Spectra via Dual-Stream Line Graph Diffusion"
authors = [
    {name = "Xujun Che",email = "xche@charlotte.edu"},
    {name = "Xiuxia Du"},
    {name = "Depeng Xu"}
]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch (==2.10.0)",
    "torch-geometric (==2.7.0)",
    "pytorch-lightning (==2.6.1)",
    "torchmetrics (==1.8.2)",
    "rdkit (==2024.9.4)",
    "hydra-core (==1.3.2)",
    "omegaconf (==2.3.0)",
    "numpy (==1.26.4)",
    "pandas (==2.3.3)",
    "scipy (==1.15.3)",
    "scikit-learn (==1.7.2)",
    "matplotlib (==3.10.6)",
    "h5py (==3.15.1)",
    "joblib (==1.5.3)",
    "tqdm (==4.67.1)",
    "tqdm-joblib (==0.0.5)",
    "wandb (==0.24.2)",
    "pathos (==0.3.5)",
    "highspy (==1.13.1)",
    "pulp (==2.8.0)",
    "myopic-mces (==1.0.1)",
    "requests (==2.32.5)"
]

[project.optional-dependencies]
ray = [
    "ray (>=2.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
